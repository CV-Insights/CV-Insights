<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CV Insight | Login</title>

    <link rel="stylesheet" href="login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

   

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <div class="container">

        <!-- Left Side -->

        <div class="left">

            <div class="logo">
                <i class="fa-solid fa-file-lines"></i>
                <span>CV Insight</span>
            </div>

            <h1>Welcome Back!</h1>

            <p>
                Analyze your resume, improve ATS score,
                optimize keywords and land your dream job.
            </p>

            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

        </div>

        <!-- Right Side -->

        <div class="right">

            <div class="login-card">

                <h2>Login</h2>

                <p>Continue to CV Insight</p>

                <!-- Email -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        placeholder="Email Address"
                        id="email">

                </div>

                <!--S Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Password"
                        id="password">

                    <i
                        class="fa-solid fa-eye"
                        id="togglePassword">
                    </i>

                </div>

                <!-- Options -->

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <!-- Login -->

                <button id="loginBtn">


                   <a href="dashboard.html"> Login</a>

                </button>

                <div class="divider">

                    OR

                </div>

                <button class="google">

                    <i class="fab fa-google"></i>

                    Continue with Google

                </button>

                <div class="signup">

                    Don't have an account?

                    <a href="profile-setup.html">Sign Up</a>

                </div>

            </div>

        </div>

    </div>

<script src="login.js"></script>

</body>

</html>
